<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标签页清理 · 交互使用图</title>
<style>
  :root { color-scheme: light; background: #ece7db; color: #292c35; font-family: system-ui, sans-serif; }
  body { margin: 0; }
  main { max-width: 820px; margin: auto; padding: 20px 16px; }
  figure { margin: 0; }
  svg { display: block; width: 100%; height: auto; background: #f9f5e9; border: 1px solid #c7baa6; box-sizing: border-box; }
  svg text { font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; fill: #292c35; }
  .paper { fill: #f9f5e9; }
  .outline { fill: #fffdf5; stroke: #535762; stroke-width: 2.8; stroke-linejoin: round; }
  .ink { fill: none; stroke: #39404d; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .lead { fill: none; stroke: #a43d33; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
  .eyebrow { font-size: 27px; font-weight: 650; letter-spacing: 3px; }
  .title { font-size: 77px; font-weight: 800; letter-spacing: -2px; }
  .intro { font-size: 33px; }
  .heading { font-size: 41px; font-weight: 750; }
  .label { font-size: 33px; font-weight: 720; }
  .small { font-size: 29px; fill: #4d4e55; }
  .number { font-size: 27px; fill: #9e382f; font-weight: 750; text-anchor: middle; }
  .cream { fill: #f5e7bc; }
  .green { fill: #dce7ce; }
  .mist { fill: #e1e8ed; }
  .brush { fill: #f1dace; }
  .frame { fill: #fcfaf1; stroke: #888170; stroke-width: 2.6; stroke-linejoin: round; }
  .lit .frame { stroke: #a43d33; stroke-width: 5; }
  .current { visibility: hidden; fill: #a43d33; font-size: 23px; font-weight: 700; }
  .lit .current { visibility: visible; }
  .tab { fill: #fcfbf3; stroke: #737680; stroke-width: 2.3; }
  .tab-name { font-size: 27px; font-weight: 650; }
  .tab[data-selected="true"] { fill: #e1eaf8; stroke: #425d82; stroke-width: 3.5; }
  .tab-group[data-closed="true"] { visibility: hidden; }
  .tab-group[data-selected="true"] use.mark { visibility: visible; }
  .mark { visibility: hidden; }
  .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  button { min-height: 44px; padding: 7px 5px; border: 1px solid #766b5e; border-radius: 8px; background: #fffdf5; color: inherit; font: 650 15px/1.2 system-ui, sans-serif; cursor: pointer; }
  button[data-event="close"] { background: #9e382f; color: white; border-color: #9e382f; }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #425d82; background: #e1eaf8; }
  button:focus-visible { outline: 3px solid #425d82; outline-offset: 3px; }
  button[data-event="close"]:focus-visible { outline-color: #a43d33; }
  #status { margin: 12px 0 0; min-height: 3em; font-size: 15px; line-height: 1.5; }
  @media (max-width: 460px) { main { padding: 8px; } .controls { grid-template-columns: repeat(2, 1fr); } }
</style>

        <button type="button" data-event="group" aria-pressed="false">勾选整组</button>
        <button type="button" data-event="close">关闭所选</button>

</main>
<script>
  const tabs = [
    { id: 0, pinned: false },
    { id: 1, pinned: false },
    { id: 2, pinned: true },
    { id: 3, pinned: false },
  ];
  const choices = {
    single: { candidates: [0], description: '点击「路线」卡片，选中了 1 页。' },
    marquee: { candidates: [0, 1, 2], description: '框选了 2 个普通页，选框内固定的「日历」仍受保护。' },
    group: { candidates: [0, 1, 2], description: '「周末计划」选中了 2 个普通页，固定页跳过。' },
  };

  const start = { at: 'ready', selected: [], closed: [] };
  let current = start;
  const states = document.querySelectorAll('[data-state]');
  const cards = document.querySelectorAll('[data-tab]');
  const buttons = document.querySelectorAll('[data-event]');
  const result = document.querySelector('#result');
  const status = document.querySelector('#status');

  function render() {
    for (const state of states) state.classList.toggle('lit', state.dataset.state === current.at);
    for (const button of buttons) {
      if (button.hasAttribute('aria-pressed')) {
        button.setAttribute('aria-pressed', String(button.dataset.event === current.at));
      }
    }
    for (const card of cards) {
      const id = Number(card.dataset.tab);
      const selected = String(current.selected.includes(id));
      card.dataset.selected = selected;
      card.querySelector('.tab').dataset.selected = selected;
      card.dataset.closed = String(current.closed.includes(id));
    }
    result.textContent = current.at === 'closed' ? `已关闭 ${current.closed.length} 个普通标签页。` : '确认选中项后，一次关掉。';
  }

  function transition(state, event) {
    if (event === 'close') {
      if (state.selected.length === 0) return {
        next: state,
        message: state.at === 'closed' ? '这批已关完。试一种选择方式再来一次。' : '先选择要关闭的标签页，再点「关闭所选」。',
      };
      const closed = tabs.filter(tab => !tab.pinned && state.selected.includes(tab.id)).map(tab => tab.id);
      return {
        next: { at: 'closed', selected: [], closed },
        message: `已关闭 ${closed.length} 个普通标签页，固定的「日历」仍打开。`,
      };
    }

    const choice = choices[event];
    const selected = tabs.filter(tab => !tab.pinned && choice.candidates.includes(tab.id)).map(tab => tab.id);
    return {
      next: { at: event, selected, closed: [] },
      message: choice.description + ' 现在可以关闭所选。',
    };
  }

  function dispatch(event) {
    const { next, message } = transition(current, event);
    current = next;
    status.textContent = message;
    render();
  }

  for (const button of buttons) button.addEventListener('click', () => dispatch(button.dataset.event));
  render();
</script>
</html>
