<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>试着清理标签页 · Tab Manager</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      color: #242e2b;
      background: #faf9f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 32px, 660px); margin: 32px auto 64px; }
    a { color: #356459; text-underline-offset: .2em; }
    header { margin: clamp(28px, 5vh, 50px) 0 24px; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.2; letter-spacing: -.04em; }
    header p { margin: 12px 0 0; color: #50625b; }
    .board {
      background: #e7efe7; border: 1px solid #c9d8cb;
      border-radius: 20px; padding: clamp(12px, 3vw, 22px);
    }
    .board-header { display: flex; align-items: baseline; justify-content: space-between; margin: 0 3px 14px; }
    h2 { margin: 0; font-size: 18px; }
    .count { color: #466052; font-size: 14px; font-variant-numeric: tabular-nums; }
    ul { padding: 0; margin: 0; list-style: none; display: grid; gap: 8px; }
    .card {
      display: flex; align-items: center; gap: 12px; min-height: 70px;
      border: 2px solid transparent; padding: 10px 14px; border-radius: 12px; background: #fff;
    }
    .card[hidden] { display: none; }
    .illustration { width: 46px; height: 42px; flex-shrink: 0; }
    .card strong { font-size: clamp(17px, 3vw, 21px); }
    .pin, .check { margin-inline-start: auto; flex-shrink: 0; }
    .pin { display: inline-flex; align-items: center; gap: 4px; color: #735329; font-size: 13px; }
    .pin svg { width: 16px; height: 16px; }
    .check { width: 23px; height: 23px; border: 2px solid #97a69f; border-radius: 6px; }
    [data-state="selected"] .ordinary { border-color: #468474; background: #edf7f1; }
    [data-state="selected"] .check { border-color: #215e4e; background: #215e4e; position: relative; }
    [data-state="selected"] .check::after {
      content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px;
      border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 10px; }
    button {
      background: #fff; font: inherit; font-weight: 650; color: #364c43;
      border: 1px solid #b9c6bd; padding: 8px 16px; min-height: 44px; border-radius: 9px; cursor: pointer;
    }
    button[data-next] { background: #215e4e; color: white; border-color: #215e4e; }
    button:hover { border-color: #215e4e; }
    :is(button, a):focus-visible { outline: 3px solid #227a8f; outline-offset: 3px; }
    #status { margin: 0; min-height: 3em; color: #485d52; }
    @media (max-width: 420px) {
      main { margin-top: 20px; }
      .card { gap: 8px; padding: 9px; }
      .illustration { width: 38px; }
      button { flex: 1; padding: 8px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .board[data-state="open"] .ordinary { animation: appear .18s ease-out; }
      @keyframes appear { from { opacity: .25; transform: translateY(3px); } }
    }
  </style>
</head>
<body>
  <main>
    <a href="./">← Tab Manager 项目主页</a>
    <header>
      <h1>试着清理标签页</h1>
      <p>用两张食谱练习批量关闭，再把它们恢复。带锁的换算表会一直保留。</p>
    </header>

    <section class="board" data-state="open" aria-labelledby="group-title">
      <div class="board-header">
        <h2 id="group-title">周末烘焙</h2>
        <span class="count">3 个标签页</span>
      </div>
      <ul>
        <li class="card">
          <svg class="illustration" viewBox="0 0 64 50" aria-hidden="true">
            <g stroke="#345561" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
              <path d="M43 12h5c10 1 9 16-1 17h-5" fill="none"/>
              <path d="M8 9l8 5 4 27c1 3 19 4 23 0l2-30z" fill="#d4e7eb"/>
              <path d="M19 28q11 3 24 0l-2 12q-10 3-20-1z" stroke="none" fill="#96bfca"/>
              <path d="M26 18h7m-6 6h4m-4 6h7" fill="none"/>
            </g>
          </svg>
          <strong>常用换算表</strong>
          <span class="pin">
            <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.8" y="7" width="10.4" height="7.4" rx="1.6"/><path d="M5 7V4.8a3 3 0 0 1 6 0V7"/></g></svg>
            已固定
          </span>
        </li>
        <li class="card ordinary">
          <svg class="illustration" viewBox="0 0 64 50" aria-hidden="true">
            <g stroke="#805b32" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5">
              <path d="M7 20l32-11 16 11-1 17-32 9L7 36z" fill="#d99f62"/>
              <path d="M7 20l17 10 31-10-16-11z" fill="#ffe1a1"/>
              <path d="M24 30l-1 15m9-14 14-4" fill="none"/>
              <path d="M28 10q2-7 11-7 8 0 11 9l-21 5z" fill="#f2c655"/>
              <path d="M32 13l4-6m3 5 1-5m3 4 1-3" stroke-width="1.2"/>
            </g>
          </svg>
          <strong>柠檬磅蛋糕</strong><span class="check" aria-hidden="true"></span>
        </li>
        <li class="card ordinary">
          <svg class="illustration" viewBox="0 0 64 50" aria-hidden="true">
            <g stroke="#7b573b" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
              <path d="M29 12q8-8 18-2c9 5 12 16 4 24-5 7-16 7-23 2-8-6-8-16 1-24z" fill="#d6a575"/>
              <path d="M11 21c7-11 22-9 28-1 8 11 1 23-11 25-15 2-25-11-17-24z" fill="#eac391"/>
              <path d="m17 25 5-2m4 6 4-3m-6 12 4-3m-13-4 2 2m29-15 2 1m-9-3 3-2m6 11 2-2" fill="none"/>
            </g>
          </svg>
          <strong>燕麦饼干</strong><span class="check" aria-hidden="true"></span>
        </li>
      </ul>
    </section>

    <div class="actions" role="group" aria-label="尝试清理操作">
      <button type="button" data-event="select" data-next>框选</button>
      <button type="button" data-event="close">关闭所选</button>
      <button type="button" data-event="undo">撤销关闭</button>
    </div>
    <p id="status" role="status">点「框选」，看看哪些示例页会被选中。</p>
  </main>

  <script>
    const states = {
      open: { next: "select", count: "3 个标签页", on: { select: "selected" } },
      selected: { next: "close", count: "已选 2 个", on: { close: "closed" } },
      closed: { next: "undo", count: "1 个标签页", on: { undo: "open" } }
    };
    const feedback = {
      select: "已选中两张食谱，固定的换算表仍受保护。",
      close: "两张食谱已关闭，换算表还在。点「撤销关闭」可以恢复。",
      undo: "两张食谱已恢复，可以再试一次。"
    };
    const board = document.querySelector(".board");
    const status = document.querySelector("#status");
    const buttons = document.querySelectorAll("[data-event]");
    function refusal(state, event) {
      if (event === "undo") return "先关闭一批标签页，再试试撤销。";
      if (event === "close") return "还没有选中的标签页，请先框选。";
      return state === "selected" ? "两张食谱已经选中，可以点「关闭所选」。" : "两张食谱已关闭，请先撤销关闭。";
    }
    for (const button of buttons) {
      button.addEventListener("click", () => {
        const current = board.dataset.state;
        const event = button.dataset.event;
        const next = states[current].on[event];
        if (!next) {
          status.textContent = refusal(current, event);
          return;
        }
        board.dataset.state = next;
        board.querySelector(".count").textContent = states[next].count;
        for (const card of board.querySelectorAll(".ordinary")) card.hidden = next === "closed";
        for (const action of buttons) action.toggleAttribute("data-next", action.dataset.event === states[next].next);
        status.textContent = feedback[event];
      });
    }
  </script>
</body>
</html>
